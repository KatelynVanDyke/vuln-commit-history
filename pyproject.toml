[project]
name = "vuln-commit-history"
version = "0.1.0"
description = "Data-building pipeline: natural MegaVul commit histories encoded as discrete DBN time slices"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pgmpy>=1.0.0",
    "joblib>=1.4",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vuln_commit_history"]
